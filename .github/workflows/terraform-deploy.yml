# Manual plan/apply against a real AWS account.
# Authenticates with GitHub OIDC: no long-lived AWS keys stored in GitHub.
# Setup: create an IAM role trusting token.actions.githubusercontent.com for this repo,
# then add repository variables AWS_ROLE_ARN and TF_STATE_BUCKET.
name: Terraform deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan or apply
        type: choice
        options: [plan, apply]
        default: plan
      image_tag:
        description: WorkHub image tag to deploy
        default: latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Init with remote state
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="encrypt=true"
      - name: Plan
        run: terraform plan -input=false -var="image_tag=${{ inputs.image_tag }}" -out=tfplan
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan
