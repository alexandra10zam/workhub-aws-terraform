name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: fmt · validate · tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive -diff
      - name: Validate dev environment
        working-directory: environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  security:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned version: new Checkov releases add checks, which should be a deliberate upgrade, not a surprise red build
      - run: pip install checkov==3.2.255
      - run: checkov -d . --framework terraform --config-file .checkov.yaml --compact --quiet
