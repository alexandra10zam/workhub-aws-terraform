# Checks consciously skipped for the dev environment. Each one is a cost/complexity
# trade-off, not an oversight; the README lists what changes for production.
skip-check:
  - CKV_AWS_149   # Secrets Manager CMK: AWS-managed key is fine for dev, CMK costs $1/month per key
  - CKV_AWS_136   # ECR KMS: AES256 at rest is enabled; CMK adds cost without changing the threat model here
  - CKV_AWS_158   # CloudWatch logs KMS: same reasoning as above
  - CKV_AWS_354   # Performance Insights CMK: default AWS key in dev
  - CKV_AWS_338   # 1-year log retention: 14 days in dev, configurable via log_retention_days
  - CKV_AWS_157   # RDS Multi-AZ: variable multi_az=true for production
  - CKV_AWS_293   # RDS deletion protection: variable deletion_protection=true for production
  - CKV_AWS_150   # ALB deletion protection: dev environment is meant to be torn down
  - CKV_AWS_118   # RDS enhanced monitoring: Performance Insights already enabled
  - CKV_AWS_91    # ALB access logs: needs an S3 bucket with a bucket policy, planned for prod
  - CKV_AWS_2     # HTTPS listener: created automatically when certificate_arn is set
  - CKV_AWS_260   # Port 80 open: required for the HTTP->HTTPS redirect
  - CKV_AWS_103   # TLS 1.2+: enforced on the HTTPS listener when a certificate is set
  - CKV2_AWS_20   # HTTP->HTTPS redirect: enabled automatically when certificate_arn is set
  - CKV2_AWS_28   # WAF on the ALB: planned for prod (adds ~$5+/month)
  - CKV2_AWS_57   # Rotation for API basic-auth secret: needs a rotation Lambda, out of scope
  - CKV2_AWS_30   # RDS query logging: slow-query logging via log_min_duration_statement instead
  - CKV_AWS_378   # ALB->target HTTP inside the VPC: TLS terminates at the ALB
